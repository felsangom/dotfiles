# -----------------------------------------------------------------------------
# KITTY CONFIGURATION - Felipe's Migration from Tmux
# -----------------------------------------------------------------------------

# --- Theme ---
# Using official Tokyo Night Storm from Folke's repository
include theme.conf

# --- Window Decoration ---
linux_display_server wayland
hide_window_decorations yes

# --- Font & Aesthetics ---
font_family      family="CaskaydiaCove Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Windows & Layouts (Your tmux panes) ---
window_margin_width     0
window_padding_width    4
draw_minimal_borders    yes

# --- Tabs (Your tmux status bar) ---
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     round
tab_title_template      "{index}: {title.split(': ', 1)[-1]}"
active_tab_title_template "{index}: {title.split(': ', 1)[-1]}"

# --- Behavior ---
scrollback_lines 10000
mouse_hide_wait  3.0
enable_audio_bell no
visual_bell_duration 0.0
# Auto-renumber tabs
tab_bar_at_top    no

# Layouts
enabled_layouts splits,stack,tall,fat

# --- Keyboard Shortcuts (The tmux soul) ---
kitty_mod ctrl+shift

# Prefix simulation: C-\ followed by...
map ctrl+\>| launch --location=vsplit --cwd=current
map ctrl+\>- launch --location=hsplit --cwd=current
map ctrl+\>c new_tab_with_cwd
map ctrl+\>n next_tab
map ctrl+\>p previous_tab
map ctrl+\>& close_tab
map ctrl+\>r set_tab_title

# Quick Tab Switching
map ctrl+\>1 goto_tab 1
map ctrl+\>2 goto_tab 2
map ctrl+\>3 goto_tab 3
map ctrl+\>4 goto_tab 4
map ctrl+\>5 goto_tab 5

# Window Navigation
map ctrl+\>h neighboring_window left
map ctrl+\>j neighboring_window down
map ctrl+\>k neighboring_window up
map ctrl+\>l neighboring_window right

# Resize panes
map ctrl+\>left resize_window narrower
map ctrl+\>right resize_window wider
map ctrl+\>up resize_window taller
map ctrl+\>down resize_window shorter

# Zoom
map ctrl+\>z toggle_layout stack

# Reload configuration
map ctrl+\>comma combine : load_config_file : env reload_kitty

# --- VI Mode / Scrollback ---
map ctrl+\>[ show_scrollback
scrollback_pager nvim -c "set signcolumn=no showtabline=0" -c "silent! %s/\s\+$//e" -c "autocmd TermOpen * startinsert" -c "map <silent> q :qa!<CR>" -c "set buftype=nofile" -
